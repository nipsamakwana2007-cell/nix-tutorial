<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Website</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f4f6f8;
            padding: 50px 20px;
        }

        .card {
            background: rgb(255, 255, 255);
            max-width: 450px;
            margin: 0 auto;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #2563eb;
        }

        p {
            color: #555;
            font-size: 16px;
            line-height: 1.6;
        }

        .badge {
            display: inline-block;
            background: #e0e7ff;
            color: #3730a3;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 14px;
            margin: 5px;
        }

        /* Container to keep buttons side by side and centered */
        .links-container {
            margin-top: 25px;
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        /* Base button styling */
        .btn {
            text-decoration: none;
            /* Removes the default underline */
            background-color: #2563eb;
            /* Solid blue */
            color: #ffffff;
            /* White text */
            padding: 10px 18px;
            /* Clickable area */
            border-radius: 8px;
            /* Rounded corners */
            font-weight: 500;
            display: inline-block;
            transition: all 0.2s ease;
            /* Makes hover smooth */
        }

        /* Hover effect on primary button */
        .btn:hover {
            background-color: #1d4ed8;
            /* Slightly darker blue */
            transform: translateY(-2px);
            /* Lifts up slightly */
        }

        /* Secondary outline button */
        .btn-outline {
            background-color: transparent;
            color: #2563eb;
            border: 1.5px solid #2563eb;
        }

        /* Hover effect on outline button */
        .btn-outline:hover {
            background-color: #eff6ff;
            /* Soft light blue tint */
        }
    </style>
</head>

<body>

    <div class="card">
        <h1>Hello, I'm Learning Web Dev! 👋</h1>
        <p>This is my first live website built with HTML & hosted on GitHub.</p>
        <div>
            <span class="badge">HTML</span>
            <span class="badge">Git</span>
            <span class="badge">GitHub</span>
        </div>
        <div class="links-container">
            <a href="https://github.com/nipsamakwana2007-cell" target="_blank" class="btn">My GitHub</a>
            <a href="mailto:nipsamakwana2007@gmail.com" class="btn btn-outline">Contact Me</a>
        </div>
    </div>

</body>

</html>
