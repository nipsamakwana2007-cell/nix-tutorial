<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Website</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f4f6f8;
            padding: 50px 20px;
        }

        .card {
            background: white;
            max-width: 450px;
            margin: 0 auto;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #2563eb;
        }

        p {
            color: #555;
            font-size: 16px;
            line-height: 1.6;
        }

        .badge {
            display: inline-block;
            background: #e0e7ff;
            color: #3730a3;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 14px;
            margin: 5px;
        }
    </style>
</head>

<body>

    <div class="card">
        <h1>Hello, I'm Learning Web Dev! 👋</h1>
        <p>This is my first live website built with HTML & hosted on GitHub.</p>
        <div>
            <span class="badge">HTML</span>
            <span class="badge">Git</span>
            <span class="badge">GitHub</span>
        </div>
    </div>

</body>

</html>
